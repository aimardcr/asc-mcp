[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asc-mcp"
version = "0.2.0"
description = "Read-only MCP server for fast, on-demand Android artifact analysis"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "androguard>=4.1.3",
    "mcp>=2,<3",
    "mutf8>=1.1.0",
]

[project.scripts]
asc-mcp = "asc_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["asc_mcp", "asc_mcp.*"]

[tool.setuptools.package-data]
"asc_mcp" = ["py.typed"]
